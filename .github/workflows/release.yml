name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bootstrap exact versions and lockfile (first build only)
        shell: pwsh
        run: |
          if (!(Test-Path package-lock.json)) {
            node scripts/pin-dependencies.mjs
            npm install --package-lock-only --ignore-scripts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Lock resolved stable dependencies for reproducible Windows builds"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Verify installed app and renderer
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "release/WhatsAppScheduler-Setup-x64.exe"
          if ($sig.Status -ne 'NotSigned') { throw "Expected unsigned installer, got $($sig.Status)" }
          $dest = Join-Path $env:RUNNER_TEMP "WhatsAppScheduler-installed"
          $p = Start-Process "release/WhatsAppScheduler-Setup-x64.exe" -ArgumentList @("/S", "/D=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $env:APP_EXE = Join-Path $dest "WhatsApp Scheduler.exe"
          if (!(Test-Path $env:APP_EXE)) { throw "Installed executable missing" }
          npm run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-and-verification
          path: |
            release/*.exe
            release/*.sha256
            smoke-output/*
            package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: smoke-output/*.png
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $sha = git rev-parse HEAD
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0 -and "${{ github.ref }}" -notlike "refs/tags/*") { exit 0 }
          $hash = (Get-FileHash release/WhatsAppScheduler-Setup-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WhatsAppScheduler-Setup-x64.exe" | Out-File -Encoding ascii release/WhatsAppScheduler-Setup-x64.exe.sha256
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $sha --title "WhatsApp Scheduler $tag" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag release/WhatsAppScheduler-Setup-x64.exe release/WhatsAppScheduler-Setup-x64.exe.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view $tag --json url,assets

