name: Account-free WhatsApp QR diagnostic
on:
  push:
    branches: [main]
    paths: ['scripts/probe-whatsapp.mjs', '.github/workflows/diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qr:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/probe-whatsapp.mjs
